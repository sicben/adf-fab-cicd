name: Deploy ADF to Prod

on:
  push:
    branches: [adf_publish]
  workflow_dispatch:      # 手动按钮，备用

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        env:
          AZ_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZ_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZ_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZ_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          az login --service-principal \
            -u "$(printf '%s' "$AZ_CLIENT_ID" | tr -d '[:space:]')" \
            -p "$(printf '%s' "$AZ_CLIENT_SECRET" | tr -d '[:space:]')" \
            -t "$(printf '%s' "$AZ_TENANT_ID" | tr -d '[:space:]')"
          az account set --subscription "$(printf '%s' "$AZ_SUBSCRIPTION_ID" | tr -d '[:space:]')"
      - name: Deploy ARM to prod factory
        env:
          CONN_STR: ${{ secrets.ADF_STORAGE_CONNECTION_STRING }}
        run: |
          az deployment group create \
            --resource-group rg-fab-etl \
            --template-file ARMTemplateForFactory.json \
            --parameters @ARMTemplateParametersForFactory.json \
              factoryName=adf-fab-etl-prod-83127 \
              AzureBlobStorage1_connectionString="$CONN_STR" \
              AzureDatabricks2_accessToken=""

      - name: Done
        run: echo "ADF deployed to adf-fab-etl-prod-83127"
